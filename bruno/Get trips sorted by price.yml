info:
  name: Get trips sorted by price
  type: http
  seq: 9

http:
  method: GET
  url: http://localhost:8080/api/trips?sort=price,desc
  params:
    - name: sort
      value: price,desc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
