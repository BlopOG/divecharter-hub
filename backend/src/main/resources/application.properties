spring.application.name=backend
# Load private values from backend/.env
spring.config.import=optional:file:.env[.properties]

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/divecharter
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Pagination
spring.data.web.pageable.max-page-size=50
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# CORS: which frontends may call this API (comma-separated)
app.cors.allowed-origins=http://localhost:5173

# Login/register rate limit: attempts per IP address per time window
app.rate-limit.auth-max-attempts=5
app.rate-limit.auth-window-seconds=60